<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" viewBox="0 0 880 570" role="img" aria-labelledby="title desc">
  <title id="title">布局、插件代码和 Runtime 如何协作</title>
  <desc id="desc">app-ui.json 决定选用哪些插件、放在哪里、顺序和启停。项目 plugins 目录中的代码配置组件属性、样式和组合。前端 Runtime 使用这两部分组织插槽和插件，管理生命周期，并让会话列表、输入框、图表等插件使用共享会话状态和服务。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#77859a"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 22px; fill: #24324b; }
      .heading { font-size: 24px; font-weight: 650; }
      .small { font-size: 20px; fill: #59687f; }
      .flow { fill: none; stroke: #77859a; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="880" height="570" rx="20" fill="#f5f7fc"/>
  <rect x="28" y="28" width="398" height="136" rx="14" fill="#ffffff" stroke="#cdd5e4" stroke-width="2"/>
  <text class="heading" x="52" y="65">app-ui.json · 布局与组合</text>
  <text x="52" y="106">选用哪些插件，放在哪里</text>
  <text class="small" x="52" y="140">区域大小 · 顺序 · 启停</text>
  <rect x="454" y="28" width="398" height="136" rx="14" fill="#ffffff" stroke="#cdd5e4" stroke-width="2"/>
  <text class="heading" x="478" y="65">plugins/ · 插件定制入口</text>
  <text x="478" y="106">组件长什么样，如何交互</text>
  <text class="small" x="478" y="140">属性 · 样式 · 组件组合</text>

  <path class="flow" d="M227 164 V194 H330 V224"/>
  <path class="flow" d="M653 164 V194 H550 V224"/>
  <rect x="96" y="224" width="688" height="146" rx="14" fill="#eaf2ff" stroke="#98b6d8" stroke-width="2"/>
  <text class="heading" text-anchor="middle" x="440" y="266">前端 Runtime · 把插件组织成一个界面</text>
  <text text-anchor="middle" x="440" y="307">插槽组合 · 插件生命周期 · 共享会话状态与服务</text>
  <text class="small" text-anchor="middle" x="440" y="343">所有插件共用同一套会话和 Agent 连接</text>

  <path class="flow" d="M240 370 V412"/>
  <path class="flow" d="M440 370 V412"/>
  <path class="flow" d="M640 370 V412"/>
  <rect x="150" y="412" width="180" height="78" rx="12" fill="#f4f0ff" stroke="#b6a5ea" stroke-width="2"/>
  <text text-anchor="middle" x="240" y="460">会话列表</text>
  <rect x="350" y="412" width="180" height="78" rx="12" fill="#f4f0ff" stroke="#b6a5ea" stroke-width="2"/>
  <text text-anchor="middle" x="440" y="460">输入框</text>
  <rect x="550" y="412" width="180" height="78" rx="12" fill="#f4f0ff" stroke="#b6a5ea" stroke-width="2"/>
  <text text-anchor="middle" x="640" y="460">图表等插件</text>
  <text class="small" text-anchor="middle" x="440" y="539">插槽（Slot）是预留的位置，Runtime 把选中的插件放进去。</text>
</svg>
