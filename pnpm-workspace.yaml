packages:
  - "apps/*"
  - "examples/*"
  - "packages/*"

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@assistant-ui/core@0.3.18'
  - '@assistant-ui/react-ag-ui@0.0.60'
  - '@assistant-ui/react-generative-ui@0.0.18'
  - '@assistant-ui/react-markdown@0.14.16'
  - '@assistant-ui/react@0.15.21'
  - '@assistant-ui/store@0.3.13'
  - '@assistant-ui/tap@0.9.17'
  - assistant-cloud@0.2.0
  - assistant-stream@0.3.42
  - safe-content-frame@0.0.30
  - tw-shimmer@0.4.13

# Keep scripts runnable when the pinned pnpm cannot be fetched, without letting
# a fallback pnpm rewrite an existing node_modules tree automatically.
pmOnFail: warn
verifyDepsBeforeRun: warn
