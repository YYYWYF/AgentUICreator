packages:
  - "apps/*"
  - "examples/*"
  - "packages/*"

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@assistant-ui/react@0.15.22'
  - '@assistant-ui/react-ag-ui@0.0.62'
  - '@assistant-ui/react-generative-ui@0.0.21'
  - '@assistant-ui/react-markdown@0.14.16'
  - '@assistant-ui/core@0.3.21'
  - '@assistant-ui/store@0.3.15'
  - '@assistant-ui/tap@0.9.19'
  - assistant-stream@0.3.45
  - assistant-cloud@0.2.3
  - safe-content-frame@0.0.31
  - tw-shimmer@0.4.13

# Keep scripts runnable when the pinned pnpm cannot be fetched, without letting
# a fallback pnpm rewrite an existing node_modules tree automatically.
pmOnFail: warn
verifyDepsBeforeRun: warn
