<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body { margin: 24px; background: #eee; } * { box-sizing: content-box; } button { color: red; border: 4px dotted red; } input, p { font-size: 32px; background: yellow; }</style>
</head><body>
<agent-ui endpoint="/agent" locale="zh-CN" theme="violet"></agent-ui>
<script>
const ui = document.querySelector('agent-ui');
// Property assignment deliberately precedes Custom Element registration.
ui.config = { conversationDataEndpoint: '/api' };
ui.addEventListener('ready', event => console.info('ready', event.detail));
ui.addEventListener('thread-change', event => console.info('thread-change', event.detail));
ui.addEventListener('error', event => console.error('error', event.detail));
</script>
<script src="/agent-ui.js"></script>
<script type="module" src="/src/attachments.ts"></script>
</body></html>
