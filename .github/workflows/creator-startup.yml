name: Source copy pnpm dev startup
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev]
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.0.0', '22.0.0', '24.22.1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # No product install/build, generated Host is prepared.
      # The command under test must bootstrap everything through pnpm dev.
      - run: pnpm verify:dev-startup --install-browser
      - name: Creator runtime compatibility
        run: >-
          pnpm --filter @za38.03/agent-ui-creator exec vitest run
          tests/node20-compatibility.test.ts
          tests/creator-model-config.test.ts
          tests/creator-agent-runtime.test.ts
          tests/creator-model-reasoning.test.ts
          tests/creator-agent-client-interrupt.test.ts
          tests/creator-node-process.test.ts
          tests/standalone-server.test.ts
