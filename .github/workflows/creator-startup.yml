name: Source copy pnpm dev startup
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev]
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.19.0', '24.20.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/creator-python/requirements.lock
      # No install, build, generated Host or repository Python venv is prepared.
      # The command under test must bootstrap everything through pnpm dev.
      - run: pnpm verify:dev-startup --install-browser
