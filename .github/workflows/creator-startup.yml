name: Source copy pnpm dev startup
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev]
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24.22.1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm docs:install
      - run: pnpm docs:package
      # No product install/build, generated Host is prepared.
      # The command under test must bootstrap everything through pnpm dev.
      - run: pnpm verify:dev-startup --install-browser
