name: Agent UI style isolation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/creator/**'
      - 'packages/creator/src/mock-agent/**'
      - 'packages/creator/operator/src/bootstrap/**'
      - 'packages/plugins/**'
      - 'packages/runtime-*/**'
      - 'scripts/**'
      - 'packages/creator/operator/**'
      - 'packages/source-registry/**'
      - 'examples/creator-embedded-host/**'
      - 'apps/creator-workbench/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/style-isolation.yml'
  push:
    branches: [dev]
    paths:
      - 'packages/creator/**'
      - 'packages/creator/src/mock-agent/**'
      - 'packages/creator/operator/src/bootstrap/**'
      - 'packages/plugins/**'
      - 'packages/runtime-*/**'
      - 'scripts/**'
      - 'packages/creator/operator/**'
      - 'packages/source-registry/**'
      - 'examples/creator-embedded-host/**'
      - 'apps/creator-workbench/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/style-isolation.yml'

jobs:
  style-isolation:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', '24.22.1']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --engine-strict
      - run: pnpm --filter @za38.03/agent-ui-creator-workbench exec playwright install --with-deps chromium
      - name: Assistant UI upgrade contract and style/integration gate
        run: pnpm verify:assistant-ui-upgrade
      - run: pnpm --filter @za38.03/agent-ui-plugins build

  agent-connection:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', '24.22.1']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --engine-strict
      - run: pnpm --filter @za38.03/agent-ui-creator-workbench exec playwright install --with-deps chromium
      - run: node scripts/prepare-workbench.mjs
      - name: Agent Connection focused unit tests
        run: >-
          pnpm --filter @za38.03/agent-ui-creator exec vitest run
          tests/agent-connection.test.ts
          tests/mock-durable-workspace.test.ts
      - run: pnpm --filter @za38.03/agent-ui-creator-workbench test:e2e:agent-connection
        env:
          AGENT_UI_WORKBENCH_PREPARED: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: agent-connection-${{ matrix.node }}-test-results
          path: apps/creator-workbench/test-results/
          if-no-files-found: ignore

  theme-commands:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', '24.22.1']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --engine-strict
      - run: pnpm --filter @za38.03/agent-ui-creator-workbench exec playwright install --with-deps chromium
      - run: node scripts/prepare-workbench.mjs
      - run: pnpm --filter @za38.03/agent-ui-creator test:operator tests/plugin-commands.test.ts tests/plugin-enablement.test.ts
      - run: pnpm --filter @za38.03/agent-ui-creator exec vitest run tests/creator-enable-integration.test.ts tests/creator-workspace-manager.test.ts tests/host-preview-reload.test.ts
      - name: Agent theme input, Plugin commands and sync through real Host and Operator
        run: pnpm --filter @za38.03/agent-ui-creator-workbench test:e2e:theme-commands
        env:
          AGENT_UI_WORKBENCH_PREPARED: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: theme-command-${{ matrix.node }}-test-results
          path: apps/creator-workbench/test-results/
          if-no-files-found: ignore
