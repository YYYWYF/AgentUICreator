name: Agent UI style isolation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/creator/**'
      - 'packages/mock-agent/**'
      - 'packages/bootstrap/**'
      - 'packages/react/**'
      - 'packages/runtime-*/**'
      - 'scripts/**'
      - 'packages/project-control/**'
      - 'packages/source-registry/**'
      - 'examples/creator-embedded-host/**'
      - 'apps/creator-workbench/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/style-isolation.yml'
  push:
    branches: [dev]
    paths:
      - 'packages/creator/**'
      - 'packages/mock-agent/**'
      - 'packages/bootstrap/**'
      - 'packages/react/**'
      - 'packages/runtime-*/**'
      - 'scripts/**'
      - 'packages/project-control/**'
      - 'packages/source-registry/**'
      - 'examples/creator-embedded-host/**'
      - 'apps/creator-workbench/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/style-isolation.yml'

jobs:
  style-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-ui/creator-workbench exec playwright install --with-deps chromium
      - run: pnpm verify:assistant-ui-upgrade
      - run: pnpm --filter @agent-ui/react build

  agent-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-ui/creator-workbench exec playwright install --with-deps chromium
      - run: node scripts/prepare-workbench.mjs
      - name: Agent Connection focused unit tests
        run: >-
          pnpm --filter @agent-ui/creator exec vitest run
          tests/agent-connection.test.ts
          tests/mock-durable-workspace.test.ts
      - run: pnpm --filter @agent-ui/creator-workbench test:e2e:agent-connection
        env:
          AGENT_UI_WORKBENCH_PREPARED: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: agent-connection-test-results
          path: apps/creator-workbench/test-results/
          if-no-files-found: ignore

  theme-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: |
          python -m venv packages/creator-python/.venv
          packages/creator-python/.venv/bin/pip install -e 'packages/creator-python[test]'
      - run: pnpm --filter @agent-ui/creator-workbench exec playwright install --with-deps chromium
      - run: node scripts/prepare-workbench.mjs
      - run: pnpm --filter @agent-ui/project-control exec vitest run tests/agent-ui-theme.test.ts tests/creator-resource-commands.test.ts tests/migrated/ensure-resource-packages.test.ts
      - run: pnpm --filter @agent-ui/creator exec vitest run tests/creator-command-parser.test.ts tests/creator-command-api.test.ts tests/CreatorCommands.test.tsx tests/creator-workspace-manager.test.ts tests/host-preview-reload.test.ts
      - run: .venv/bin/python -m pytest tests/test_creator_command_commit.py tests/test_creator_transactions.py -q
        working-directory: packages/creator-python
      - name: Persistent theme, install and sync commands through real Host and ProjectControl
        run: pnpm --filter @agent-ui/creator-workbench test:e2e:theme-commands
        env:
          AGENT_UI_WORKBENCH_PREPARED: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: theme-command-test-results
          path: apps/creator-workbench/test-results/
          if-no-files-found: ignore

  i18n-plugin-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-ui/creator-workbench exec playwright install --with-deps chromium
      - run: node scripts/prepare-workbench.mjs
      - run: pnpm check:i18n
      - run: pnpm --filter @agent-ui/creator-workbench test:e2e:i18n-plugin-visual
        env:
          AGENT_UI_WORKBENCH_PREPARED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i18n-plugin-visual
          path: |
            apps/creator-workbench/test-results/i18n-plugin-visual/
            apps/creator-workbench/playwright-report/i18n-plugin-visual/
          if-no-files-found: error
