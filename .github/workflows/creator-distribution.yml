name: Creator distribution gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/creator/**'
      - 'packages/creator/**'
      - 'packages/creator-python/**'
      - 'scripts/*creator*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/creator-distribution.yml'
  push:
    tags:
      - 'creator-v*'

jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/creator-python/requirements.lock
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:python:setup
      - run: pnpm verify:creator-distribution
