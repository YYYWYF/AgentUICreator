name: Creator distribution gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/creator/contracts/creator/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - '.npmrc'
      - 'scripts/check-dependency-pins*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/creator-distribution.yml'
  push:
    tags:
      - 'creator-v*'

jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/creator/python/requirements.lock
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:dependency-pins
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:creator-distribution
      - run: pnpm verify:package
