name: Creator distribution gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/creator/contracts/creator/**'
      - 'packages/**'
      - 'scripts/**'
      - 'website/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - 'scripts/check-dependency-pins*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/creator-distribution.yml'
  push:
    tags:
      - 'creator-v*'

jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.0.0', '24.22.1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --engine-strict
      - run: pnpm docs:install
      - run: pnpm docs:package
      - run: pnpm check:dependency-pins
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:package
